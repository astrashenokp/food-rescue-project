<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head th:replace="~{fragments/layout :: head('Новий пункт призначення')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="card">
    <h1>Новий пункт призначення</h1>
    <form th:action="@{/destination-points}" th:object="${form}" method="post" novalidate>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"
             th:each="err : ${#fields.globalErrors()}" th:text="${err}">Помилка</div>

        <label for="organizationId">ID організації (UUID)</label>
        <input type="text" id="organizationId" th:field="*{organizationId}"
               placeholder="00000000-0000-0000-0000-000000000001"/>
        <div class="error" th:if="${#fields.hasErrors('organizationId')}"
             th:errors="*{organizationId}">Помилка</div>

        <label for="name">Назва</label>
        <input type="text" id="name" th:field="*{name}"/>
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Помилка</div>

        <label for="address">Адреса</label>
        <input type="text" id="address" th:field="*{address}"/>
        <div class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Помилка</div>

        <label for="workingHours">Години роботи (HH:mm-HH:mm)</label>
        <input type="text" id="workingHours" th:field="*{workingHours}" placeholder="09:00-18:00"/>
        <div class="error" th:if="${#fields.hasErrors('workingHours')}"
             th:errors="*{workingHours}">Помилка</div>

        <label for="acceptedCategories">Категорії продуктів (можна обрати кілька)</label>
        <select id="acceptedCategories" th:field="*{acceptedCategories}" multiple size="4">
            <option th:each="category : ${categories}" th:value="${category}"
                    th:text="${category}">BAKERY</option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('acceptedCategories')}"
             th:errors="*{acceptedCategories}">Помилка</div>
        <p>Для вибору кількох категорій утримуйте Ctrl.</p>

        <button type="submit" class="btn btn-success">Створити</button>
        <a th:href="@{/destination-points}" class="btn btn-secondary">Скасувати</a>
    </form>
</main>
</body>
</html>
