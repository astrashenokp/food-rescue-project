<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="uk">
<head th:replace="~{fragments/layout :: head('Пункти призначення')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="card">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <h1>Пункти призначення</h1>
    <a sec:authorize="hasRole('COORDINATOR')" th:href="@{/destination-points/new}"
       class="btn btn-primary">Додати пункт</a>
    <table>
        <thead>
        <tr><th>#</th><th>Назва</th><th>Адреса</th><th>Години роботи</th><th>Приймає категорії</th></tr>
        </thead>
        <tbody>
        <tr th:each="point, stat : ${points}">
            <td th:text="${stat.count}">1</td>
            <td th:text="${point.name}">Їдальня</td>
            <td th:text="${point.address}">Київ</td>
            <td th:text="${point.workingHours}">09:00-18:00</td>
            <td th:text="${#strings.setJoin(point.acceptedCategories, ', ')}">BAKERY</td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(points)}">Пунктів призначення поки немає.</p>
</main>
</body>
</html>
