spring.application.name=foodrescue
spring.config.import=optional:file:.env[.properties]
spring.mvc.problem-details.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.datasource.url=jdbc:h2:mem:foodrescue;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=15
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.chain.cache=true
foodrescue.alerts.url=http://localhost:9999/alerts
foodrescue.alerts.timeout=2s
foodrescue.demo.passwords.donor1=donorpass1
foodrescue.demo.passwords.volunteer1=volunteerpass1
foodrescue.demo.passwords.coordinator1=coordinatorpass1
foodrescue.demo.passwords.admin1=adminpass1
